[package]
name = "chonkgene-platform"
description = "OS integration for chonkGene: transparent pet windows, click-through, work area, cursor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tiny-skia.workspace = true
winit.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", features = ["shape", "image", "screensaver"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# The one crate allowed to use unsafe (PLAN §6 item 5); every block says why.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
