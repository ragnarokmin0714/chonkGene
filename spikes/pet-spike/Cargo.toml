[package]
name = "pet-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
cpu-time = "1.0.0"
interprocess = "2.4.6"
memory-stats = "1.2.0"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility", "unstable-winit-030"] }
tiny-skia = "0.12.0"
winit = "0.30.13"

[target.'cfg(target_os = "linux")'.dependencies]
# Load fontconfig at run time instead of linking it at build time, so the
# build needs no -dev packages and the binary stays portable (PLAN §2.1).
fontique = { version = "0.11.1", features = ["fontconfig-dlopen"] }
x11rb = { version = "0.14.0", features = ["shape", "image"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.18.1"
