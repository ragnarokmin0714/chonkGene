[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0-beta.4"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
skrifa = "0.49.0"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit-x11", "renderer-software", "accessibility", "unstable-winit-030"] }
slint-build = "1.18.1"
chonkgene-core = { path = "crates/chonkgene-core" }
chonkgene-rig = { path = "crates/chonkgene-rig" }
chonkgene-render = { path = "crates/chonkgene-render" }
chonkgene-platform = { path = "crates/chonkgene-platform" }
cpu-time = "1.0.0"
fastrand = "2.5.0"
interprocess = "2.4.6"
jiff = "0.2.38"
memory-stats = "1.2.0"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
tiny-skia = "0.12.0"
bytemuck = "1.25.2"
pollster = "1.0.1"
# Real-time 3D pets (chonkgene-render's gpu module).
wgpu = "30.0.1"
# X11 only: v1 runs under XWayland on Wayland (PLAN §0), and pet windows have
# no decorations, so the Wayland and Adwaita-frame code is left out.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11"] }

# Only chonkgene-platform may use unsafe (PLAN §6); it overrides this.
[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
# Release archives carry no symbols (smaller downloads).
strip = true
lto = "thin"

# Ray-marching in an unoptimised build is ~20× slower; the tests and the
# settings preview render sprites, so these stay fast in dev builds too.
[profile.dev.package.chonkgene-rig]
opt-level = 3

[profile.dev.package.chonkgene-render]
opt-level = 3
