[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
chonkgene-core = { path = "crates/chonkgene-core" }
chonkgene-rig = { path = "crates/chonkgene-rig" }
chonkgene-render = { path = "crates/chonkgene-render" }
fastrand = "2.5.0"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
tiny-skia = "0.12.0"
tiny-skia-path = "0.12.0"
usvg = "0.48.1"

# Only chonkgene-platform may use unsafe (PLAN §6); it overrides this.
[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
