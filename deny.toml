# cargo-deny policy (docs/PLAN.md §6).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# zvariant and friends were merged into zbus 6; they arrive through Slint's
# AT-SPI accessibility, which still uses zbus 5. Not vulnerabilities.
# Remove these once Slint moves to zbus 6.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; via Slint accessibility" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; via Slint accessibility" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; via Slint accessibility" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Our own crates are unpublished and their licence is still open (PLAN §10).
private = { ignore = true }
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Slint is used under its Royalty-free Desktop licence 2.0 for now, with
# the AboutSlint attribution in Settings › 一般 (PLAN §3.6, §10).
[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "slint"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "slint-build"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "slint-macros"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-backend-selector"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-backend-winit"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-common"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-compiler"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-core"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-core-macros"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-renderer-skia"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
crate = "i-slint-renderer-software"

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace path dependencies carry no version.
allow-wildcard-paths = true
# v1 never touches the network (PLAN §6 item 1).
deny = [
    { crate = "curl", reason = "no network in v1" },
    { crate = "hyper", reason = "no network in v1" },
    { crate = "isahc", reason = "no network in v1" },
    { crate = "reqwest", reason = "no network in v1" },
    { crate = "surf", reason = "no network in v1" },
    { crate = "ureq", reason = "no network in v1" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
