name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Downloadable builds of the app for trying it on real desktops.
  prototype:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            file: chonkgene-windows-x64.exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            file: chonkgene-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            file: chonkgene-linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Static CRT comes from .cargo/config.toml (PLAN §2.1).
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked -p chonkgene --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/chonkgene.exe ${{ matrix.file }}
      # One file against a glibc 2.31 baseline (Ubuntu 20.04+, Debian 11+).
      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Linux'
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-zigbuild --locked
          cargo zigbuild --release --locked -p chonkgene --target ${{ matrix.target }}.2.31
          cp target/${{ matrix.target }}/release/chonkgene ${{ matrix.file }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}
